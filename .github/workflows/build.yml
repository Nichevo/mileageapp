# Builds a release APK on every push to main (and on demand).
#
# The build number is the Actions run number, so each build is a higher
# versionCode than the last and installs over it as an update. Signing uses
# the release key from repository secrets; without the secrets the APK is
# signed with a throwaway debug key and will NOT update an installed copy.
name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MILEAGELOG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MILEAGELOG_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No MILEAGELOG_KEYSTORE_BASE64 secret; APK will be signed with a debug key"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          MILEAGELOG_STOREPASSWORD: ${{ secrets.MILEAGELOG_STOREPASSWORD }}
          MILEAGELOG_KEYALIAS: ${{ secrets.MILEAGELOG_KEYALIAS }}
          MILEAGELOG_KEYPASSWORD: ${{ secrets.MILEAGELOG_KEYPASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NAME=mileagelog-${VER}-build${{ github.run_number }}
          [ "${{ steps.keystore.outputs.signed }}" = "true" ] || NAME="${NAME}-UNSIGNED-debugkey"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME.apk"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk

      # A release gives a direct download link that works from the phone's browser.
      - name: Publish release
        if: steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MileageLog ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: Install over the previous build; settings and data are kept.
          files: ${{ env.APK_NAME }}.apk
