name: mileagelog
description: "Personal mileage, fuel and trip log."
publish_to: 'none'

# versionName+versionCode. CI overrides the build number with the run number
# so every build installs over the previous one as an update.
version: 0.15.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  fl_chart: ^1.0.0
  csv: ^6.0.0
  file_picker: ^10.3.2
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  http: ^1.4.0
  uuid: ^4.5.1
  geolocator: ^14.0.0
  package_info_plus: ^8.3.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
